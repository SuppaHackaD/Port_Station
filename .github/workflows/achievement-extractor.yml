name: Achievement Extractor checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  extractor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s achievement_extractor/tests -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish achievement_extractor/managed/Scanner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o achievement_extractor/bin
      - run: dotnet run --project achievement_extractor/tests/managed -c Release -- achievement_extractor/bin/AchievementScanner.exe
