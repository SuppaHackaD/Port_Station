name: Mesa WGL lifecycle diagnostic
on:
  push:
    branches: ['codex/**']
    paths:
      - '.github/workflows/mesa-wgl-lifecycle.yml'
      - 'release_support/mesa-wgl/build.py'
      - 'release_support/mesa-wgl/diagnostics.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mesa-wgl-lifecycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-provider:
    strategy:
      matrix:
        arch: [x86_64, i686]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python build tools
        run: python -m pip install 'Mako==1.3.10' 'MarkupSafe==3.0.4' 'meson==1.9.1' 'packaging==25.0' 'PyYAML==6.0.3'
      - name: Build pending-present cleanup without lifetime logging
        run: python release_support/mesa-wgl/build.py --work '${{ runner.temp }}/station-mesa' --jobs 2 --release-pending-present --clean --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: mesa-wgl-${{ matrix.arch }}
          path: ${{ runner.temp }}/station-mesa/artifacts
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-wgl-build-diagnostics-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/station-mesa/build/meson-logs
            ${{ runner.temp }}/station-mesa/patches.json
          retention-days: 3
